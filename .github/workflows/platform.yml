name: Cross-platform core
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run check:release
      - run: node --test tests/tools/release-check.test.mjs
      - run: npm ci
      - run: node --test tests/base/codex/protocol-client.test.mjs tests/remote/remote-protocol.test.mjs tests/remote/reconnecting-connection.test.mjs tests/remote/remote-rpc.test.mjs
      - run: node --test tests/setup/platform-service.test.mjs tests/setup/platform-smoke.test.mjs
