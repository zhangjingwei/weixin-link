<title id="title">Weixin Link 当前消息与任务架构</title>
<desc id="desc">每个微信账号一个服务实例。微信、计划、更新和管理入口进入应用用例，复用持久任务与投递状态。领域层保护规则，基础设施通过端口提供外部能力。</desc>
